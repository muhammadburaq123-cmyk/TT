<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<meta name="apple-mobile-web-app-title" content="GFT"/>
<meta name="theme-color" content="#0d1117"/>
<title>GFT Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{--dark:#0d1117;--card:#161b27;--border:#1e2a3a;--gold:#f59e0b;--text:#e2e8f0;--muted:#4a5568;--green:#34d399;--red:#f87171;}
body{background:var(--dark);color:var(--text);font-family:'DM Sans',sans-serif;font-size:12px;min-height:100vh;overscroll-behavior:none;}
#app{padding:16px 16px 40px;max-width:860px;margin:0 auto;}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;}
#loading h1{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);}
@keyframes spin{to{transform:rotate(360deg);}}
.spin{animation:spin 1s linear infinite;}
.h1{font-family:'Playfair Display',serif;font-size:22px;color:var(--gold);}
.card{background:var(--card);border-radius:12px;border:1px solid var(--border);padding:14px;}
.sec-title{color:var(--muted);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;margin:0 0 10px;}
.stat-box{background:#0d1117;border-radius:8px;padding:10px 12px;}
.stat-lbl{font-size:11px;color:var(--muted);margin-bottom:4px;}
.stat-val{font-size:20px;font-weight:600;}
.tab{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border:1px solid var(--border);border-radius:7px;cursor:pointer;font-size:12px;background:var(--card);color:var(--text);margin:0 5px 5px 0;font-family:'DM Sans',sans-serif;user-select:none;-webkit-tap-highlight-color:transparent;}
.btn{background:transparent;border:1px solid var(--border);border-radius:7px;cursor:pointer;padding:5px 12px;font-size:12px;font-weight:500;color:var(--text);font-family:'DM Sans',sans-serif;-webkit-tap-highlight-color:transparent;}
.btn:hover{border-color:var(--gold);color:var(--gold);}
.btn-gold{border-color:var(--gold)!important;color:var(--gold)!important;}
.btn-danger{border-color:#ef444466;color:#ef4444;}
input[type=text],input[type=number]{background:#0d1117;color:var(--text);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:13px;font-family:'DM Sans',sans-serif;width:100%;}
input[type=text]:focus,input[type=number]:focus{outline:1px solid var(--gold);border-color:var(--gold);}
input[type=color]{-webkit-appearance:none;appearance:none;width:32px;height:32px;border:2px solid var(--border);border-radius:6px;cursor:pointer;padding:2px;background:#0d1117;}
input[type=color]::-webkit-color-swatch-wrapper{padding:0;}
input[type=color]::-webkit-color-swatch{border-radius:4px;border:none;}
.fhr{display:grid;grid-template-columns:88px 80px 1fr 96px 28px;font-size:12px;padding:7px 0;border-bottom:1px solid var(--border);align-items:center;gap:4px;}
.bar-wrap{background:var(--border);border-radius:4px;height:7px;overflow:hidden;}
.bar-fill{height:7px;border-radius:4px;transition:width .4s;}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:10px;}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px;}
.log-scroll{overflow-y:auto;max-height:260px;}
.cswatch{width:14px;height:14px;border-radius:3px;display:inline-block;flex-shrink:0;}
#syncBar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:7px 12px;margin-bottom:12px;font-size:11px;color:var(--muted);}
#syncDot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0;transition:background .3s;}
#syncDot.ok{background:var(--green);}
#syncDot.syncing{background:var(--gold);animation:pulse 1s infinite;}
#syncDot.err{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#161b27;border:1px solid var(--gold);color:var(--gold);padding:8px 20px;border-radius:8px;font-size:12px;font-family:'DM Sans',sans-serif;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap;}
.toast.show{opacity:1;}
.alert-banner{border-radius:8px;padding:9px 13px;font-size:11px;font-weight:600;margin-top:10px;display:flex;align-items:center;gap:7px;}
@media(max-width:520px){
  .g4{grid-template-columns:repeat(2,1fr);}
  .fhr{grid-template-columns:70px 68px 1fr 76px 22px;font-size:11px;}
  #app{padding:12px 12px 40px;}
  .h1{font-size:18px;}
}
</style>
</head>
<body>

<div id="loading">
  <h1>GFT Tracker</h1>
  <i class="ti ti-loader spin" style="font-size:32px;color:var(--gold);"></i>
  <p style="color:var(--muted);font-size:11px;">Loading your data...</p>
</div>
<div id="app" style="display:none;"></div>
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbyFbRBWJEl0OnfrsUYeG4Ftk3NUVgkIcAFpQqolHfr06VtkgvA2LCIn7ZEv-7Qu_xsYvw/exec';
const CACHE_KEY='gft_v4';
const PRESET_COLORS=['#f59e0b','#34d399','#60a5fa','#f87171','#a78bfa','#fb923c','#e879f9','#2dd4bf'];
const DEFAULT_COLOR='#f59e0b';

// ── PWA Manifest ──────────────────────────────────────────
(function(){
  const icon="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="90" fill="#0d1117"/><text x="256" y="370" font-size="310" text-anchor="middle" fill="#f59e0b" font-family="Arial,sans-serif">⚡</text></svg>');
  const mf={name:'GFT Funded Tracker',short_name:'GFT',start_url:location.href,display:'standalone',background_color:'#0d1117',theme_color:'#0d1117',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml',purpose:'any maskable'}]};
  const lk=document.createElement('link');lk.rel='manifest';
  lk.href=URL.createObjectURL(new Blob([JSON.stringify(mf)],{type:'application/manifest+json'}));
  document.head.appendChild(lk);
  const al=document.createElement('link');al.rel='apple-touch-icon';al.href=icon;
  document.head.appendChild(al);
})();

// ── State ─────────────────────────────────────────────────
const G={accs:[mk(1,'GFT Account 1'),mk(2,'GFT Account 2')],sel:1,nid:3,em:false,eb:null,pa:'',pn:''};
let syncTimeout=null;

// ── Helpers ───────────────────────────────────────────────
function mk(id,lbl){
  return{
    id, label:lbl||'Account '+id,
    accNum:'', broker:'Goat Funded Trader', server:'GoatFunder-Server',
    startBal:5000, ddDay:4, ddMax:8, deadlineDays:30,
    profitTarget:10,    // % of starting balance to hit payout
    dailyProfitCap:2,   // % max profit per day — discipline guard
    color:DEFAULT_COLOR, log:[], deadline:ad(td(),30)
  };
}
function td(){const d=new Date();return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function z(n){return String(n).padStart(2,'0');}
function ad(s,n){const d=new Date(s);d.setDate(d.getDate()+n);return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function daysLeft(s){const n=new Date();n.setHours(0,0,0,0);return Math.ceil((new Date(s)-n)/86400000);}
function fd(s){const d=new Date(s);return d.getDate()+' '+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()]+' '+d.getFullYear();}
function fa(n){return(n>0?'+$':n<0?'-$':'$')+Math.abs(n).toFixed(2);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function setSS(state,msg){const d=document.getElementById('syncDot'),t=document.getElementById('syncText');if(!d||!t)return;d.className='';d.classList.add(state);t.textContent=msg;}

// ── Sync ──────────────────────────────────────────────────
async function push(){
  setSS('syncing','Syncing...');
  try{
    const r=await fetch(SCRIPT_URL,{method:'POST',body:JSON.stringify({action:'save',data:{accs:G.accs,sel:G.sel,nid:G.nid}}),headers:{'Content-Type':'text/plain'},redirect:'follow'});
    const j=await r.json();
    if(j.ok){localStorage.setItem(CACHE_KEY,JSON.stringify({accs:G.accs,sel:G.sel,nid:G.nid}));setSS('ok','Synced · '+new Date().toLocaleTimeString());}
    else throw new Error(j.error);
  }catch(e){setSS('err','Sync failed — saved locally');}
}
async function pull(){
  setSS('syncing','Loading...');
  try{
    const r=await fetch(SCRIPT_URL+'?action=load',{redirect:'follow'});
    const j=await r.json();
    if(j.data){G.accs=j.data.accs;G.sel=j.data.sel;G.nid=j.data.nid;localStorage.setItem(CACHE_KEY,JSON.stringify(j.data));setSS('ok','Synced · '+new Date().toLocaleTimeString());}
    else setSS('ok','Ready');
  }catch(e){
    const c=localStorage.getItem(CACHE_KEY);
    if(c){try{const p=JSON.parse(c);G.accs=p.accs;G.sel=p.sel;G.nid=p.nid;}catch(_){}}
    setSS('err','Offline — cached data');
  }
  render();
}
function schedulePush(){clearTimeout(syncTimeout);syncTimeout=setTimeout(push,1200);}

// ── Start ─────────────────────────────────────────────────
async function startApp(){
  const c=localStorage.getItem(CACHE_KEY);
  if(c){try{const p=JSON.parse(c);G.accs=p.accs;G.sel=p.sel;G.nid=p.nid;}catch(_){}}
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='block';
  render();
  await pull();
  setInterval(()=>{if(!G.em)pull();},30000);
}

// ── Calc ──────────────────────────────────────────────────
function calc(a){
  const tot=a.log.reduce((s,e)=>s+e.amt,0);
  const cur=a.startBal+tot;
  const pct=(tot/a.startBal)*100;
  const todP=a.log.filter(e=>e.date===td()).reduce((s,e)=>s+e.amt,0);

  // Drawdown
  const d$=a.startBal*(a.ddDay||4)/100;
  const m$=a.startBal*(a.ddMax||8)/100;
  const dl2=Math.max(0,-todP), ml2=Math.max(0,-tot);
  const dp=Math.min(dl2/d$*100,100), mp=Math.min(ml2/m$*100,100);

  // Profit target
  const target$=a.startBal*(a.profitTarget||10)/100;
  const targetProg=target$>0?Math.min(Math.max(0,tot)/target$*100,100):0;
  const targetReached=tot>=target$;
  const targetRemain$=Math.max(0,target$-tot);

  // Daily profit cap
  const cap$=a.startBal*(a.dailyProfitCap||2)/100;
  const capProg=cap$>0?Math.min(Math.max(0,todP)/cap$*100,100):0;
  const capReached=todP>=cap$;

  const days=daysLeft(a.deadline);
  let h='healthy';
  if(mp>=100||dp>=100)h='blown';
  else if(mp>=75||dp>=75||days<=3)h='danger';
  else if(mp>=50||dp>=50||days<=7)h='warning';

  return{
    tot,cur,pct,todP,d$,m$,dp,mp,dr:d$-dl2,mr:m$-ml2,days,h,
    todayCount:a.log.filter(e=>e.date===td()).length,
    target$,targetProg,targetReached,targetRemain$,
    cap$,capProg,capReached
  };
}
function hc(h,col){return h==='blown'||h==='danger'?'#ef4444':h==='warning'?'#f59e0b':(col||'#34d399');}
function bc(p){return p>=75?'#ef4444':p>=50?'#f59e0b':'#34d399';}
function pc(n){return n>=0?'#34d399':'#f87171';}

// ── Render ────────────────────────────────────────────────
function render(){
  const acc=G.accs.find(a=>a.id===G.sel);
  const st=calc(acc);
  const acol=acc.color||DEFAULT_COLOR;
  const hcol=hc(st.h,acol);

  // Sync bar
  const syncBar=`<div id="syncBar">
    <div style="display:flex;align-items:center;gap:6px;"><div id="syncDot" class="ok"></div><span id="syncText">Synced</span></div>
    <button class="btn" style="font-size:11px;padding:3px 10px;" onclick="pull()"><i class="ti ti-refresh" style="font-size:12px;vertical-align:-1px;"></i> Refresh</button>
  </div>`;

  // Tabs
  const tabs=G.accs.map(a=>{
    const tc=a.color||DEFAULT_COLOR,isA=a.id===G.sel;
    return`<span class="tab" style="${isA?`border-color:${tc};color:${tc};`:''}" onclick="selA(${a.id})"><span class="cswatch" style="background:${tc};"></span>${esc(a.label)}</span>`;
  }).join('')+`<span class="tab btn-gold" onclick="addA()"><i class="ti ti-plus"></i> Add account</span>`;

  // Account header
  const hdr=`<div class="card" style="border-color:${acol}44;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;">
      <div style="display:flex;align-items:center;gap:10px;">
        <div style="width:4px;height:40px;border-radius:2px;background:${acol};flex-shrink:0;"></div>
        <div>
          <p style="font-size:15px;font-weight:600;margin:0 0 2px;color:${acol};">${esc(acc.label)}</p>
          <p style="font-size:11px;color:var(--muted);margin:0;">${acc.accNum?'#'+esc(acc.accNum)+' · ':''} ${esc(acc.broker)} · ${esc(acc.server)}</p>
        </div>
      </div>
      <div style="display:flex;gap:6px;">
        <button class="btn" style="border-color:${acol}66;color:${acol};" onclick="togEdit()"><i class="ti ti-edit" style="font-size:13px;vertical-align:-1px;"></i> Edit</button>
        ${G.accs.length>1?`<button class="btn btn-danger" onclick="rmA(${acc.id})"><i class="ti ti-trash" style="font-size:13px;vertical-align:-1px;"></i></button>`:''}
      </div>
    </div>
  </div>`;

  // Edit form
  let ef='';
  if(G.em&&G.eb){
    const b=G.eb;
    const tf=(l,k,t,hint)=>`<div>
      <p style="font-size:11px;color:var(--muted);margin:0 0 2px;">${l}${hint?`<span style="font-size:10px;color:#2d4a6a;"> — ${hint}</span>`:''}
      </p>
      <input type="${t}" value="${t==='number'?b[k]:esc(b[k]||'')}" oninput="ebu('${k}',${t==='number'?'parseFloat(this.value)||0':'this.value'})">
    </div>`;
    const presets=PRESET_COLORS.map(c=>`<span onclick="ebu('color','${c}');document.getElementById('cpick').value='${c}';document.querySelectorAll('.psw').forEach(s=>s.style.outline=s.dataset.c==='${c}'?'2px solid #fff':'none');"
      class="psw" data-c="${c}" style="display:inline-block;width:22px;height:22px;border-radius:5px;background:${c};cursor:pointer;outline:${(b.color||DEFAULT_COLOR)===c?'2px solid #fff':'none'};outline-offset:2px;margin-right:4px;"></span>`).join('');
    ef=`<div class="card" style="border-color:${b.color||DEFAULT_COLOR};margin-bottom:10px;">
      <p style="font-weight:600;color:${b.color||DEFAULT_COLOR};margin:0 0 14px;font-size:13px;"><i class="ti ti-edit"></i> Edit account details</p>

      <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px;">Account info</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;">
        ${tf('Label','label','text')}
        ${tf('Account number','accNum','text')}
        ${tf('Broker','broker','text')}
        ${tf('Server','server','text')}
      </div>

      <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px;">Risk limits</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;">
        ${tf('Starting balance ($)','startBal','number')}
        ${tf('Daily DD limit (%)','ddDay','number','max daily loss')}
        ${tf('Max DD limit (%)','ddMax','number','total max loss')}
        ${tf('Deadline days','deadlineDays','number','days to stay active')}
      </div>

      <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 10px;">Profit & discipline</p>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:16px;">
        ${tf('Profit target (%)','profitTarget','number','% to hit payout')}
        ${tf('Daily profit cap (%)','dailyProfitCap','number','stop after this % per day')}
      </div>

      <p style="font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin:0 0 8px;">Account color</p>
      <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px;">
        <div>${presets}</div>
        <div style="display:flex;align-items:center;gap:6px;">
          <span style="font-size:11px;color:var(--muted);">Custom:</span>
          <input type="color" id="cpick" value="${b.color||DEFAULT_COLOR}" oninput="ebu('color',this.value);document.querySelectorAll('.psw').forEach(s=>s.style.outline='none');">
        </div>
      </div>

      <div style="display:flex;gap:6px;">
        <button class="btn btn-gold" onclick="saveEd()"><i class="ti ti-check"></i> Save changes</button>
        <button class="btn" onclick="G.em=false;render()">Cancel</button>
      </div>
    </div>`;
  }

  // Stats row
  const stats=`<div class="g4">
    <div class="stat-box"><p class="stat-lbl">Starting</p><p class="stat-val" style="color:${acol};">$${acc.startBal.toLocaleString()}</p></div>
    <div class="stat-box"><p class="stat-lbl">Current balance</p><p class="stat-val" style="color:${pc(st.cur-acc.startBal)};">$${st.cur.toFixed(2)}</p></div>
    <div class="stat-box"><p class="stat-lbl">Total P&amp;L</p><p class="stat-val" style="color:${pc(st.tot)};">${fa(st.tot)}</p></div>
    <div class="stat-box"><p class="stat-lbl">Account %</p><p class="stat-val" style="color:${pc(st.pct)};">${(st.pct>=0?'+':'')+st.pct.toFixed(2)}%</p></div>
  </div>`;

  // Deadline + today
  const dlc=st.days<=3?'#ef4444':st.days<=7?'#f59e0b':acol;
  const cards2=`<div class="g2">
    <div class="stat-box" style="border-radius:10px;padding:12px 14px;">
      <p class="stat-lbl"><i class="ti ti-calendar" style="font-size:12px;vertical-align:-1px;"></i> ${acc.deadlineDays||30}-day deadline</p>
      <p class="stat-val" style="color:${dlc};">${st.days>0?st.days+' days left':'Expired'}</p>
      <p style="font-size:11px;color:var(--muted);margin-top:4px;">Resets on update · ${fd(acc.deadline)}</p>
    </div>
    <div class="stat-box" style="border-radius:10px;padding:12px 14px;">
      <p class="stat-lbl"><i class="ti ti-clock" style="font-size:12px;vertical-align:-1px;"></i> Today's P&amp;L</p>
      <p class="stat-val" style="color:${pc(st.todP)};">${fa(st.todP)}</p>
      <p style="font-size:11px;color:var(--muted);margin-top:4px;">${st.todayCount} ${st.todayCount===1?'entry':'entries'} today</p>
    </div>
  </div>`;

  // DD bars + donut
  function barH(lbl,pct,lim$,rem$,col){
    const cl=col||bc(pct);
    const rem=rem$>=0?'$'+rem$.toFixed(0)+' remaining':'limit breached';
    return`<div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;flex-wrap:wrap;gap:4px;">
        <span style="color:var(--muted);">${lbl}</span>
        <span style="color:${cl};">${pct.toFixed(1)}% · ${rem} · limit $${lim$.toFixed(0)}</span>
      </div>
      <div class="bar-wrap"><div class="bar-fill" style="width:${pct}%;background:${cl};"></div></div>
    </div>`;
  }
  const ddPct=Math.max(0,100-st.mp);
  const R=44,CX=55,CY=55,CIRC=2*Math.PI*R;
  const dash=(Math.min(100,ddPct)/100)*CIRC;
  const donut=`<svg width="110" height="110" viewBox="0 0 110 110">
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="#1e2a3a" stroke-width="11"/>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${hcol}33" stroke-width="11" stroke-dasharray="${CIRC} ${CIRC}" transform="rotate(-90 ${CX} ${CY})"/>
    <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${hcol}" stroke-width="11" stroke-dasharray="${dash} ${CIRC}" stroke-linecap="round" transform="rotate(-90 ${CX} ${CY})"/>
    <text x="${CX}" y="${CY+5}" text-anchor="middle" fill="${hcol}" font-size="15" font-weight="bold" font-family="DM Sans,sans-serif">${ddPct.toFixed(1)}%</text>
  </svg>`;
  const topRow=`<div style="display:grid;grid-template-columns:1fr 120px;gap:10px;margin-bottom:10px;">
    <div class="card">
      <p class="sec-title"><i class="ti ti-trending-down" style="font-size:13px;vertical-align:-1px;"></i> Drawdown status</p>
      ${barH('Daily drawdown',st.dp,st.d$,st.dr)}
      ${barH('Total drawdown',st.mp,st.m$,st.mr)}
    </div>
    <div class="card" style="text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;">
      <p class="sec-title">Health</p>${donut}
      <p style="font-size:11px;color:${hcol};font-weight:600;margin-top:4px;text-transform:capitalize;">${st.h}</p>
    </div>
  </div>`;

  // ── PROFIT TARGET SECTION ──────────────────────────────
  const tCol=st.targetReached?'#34d399':'#f59e0b';
  const cCol=st.capProg>=100?'#ef4444':st.capProg>=75?'#f59e0b':'#34d399';

  const profitSection=`<div class="card" style="margin-bottom:10px;border-color:${tCol}44;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:6px;">
      <p class="sec-title" style="margin:0;"><i class="ti ti-target" style="font-size:13px;vertical-align:-1px;color:${tCol};"></i> Profit target &amp; discipline</p>
      ${st.targetReached?`<span style="background:#34d39922;color:#34d399;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;border:1px solid #34d39944;"><i class="ti ti-trophy" style="font-size:11px;vertical-align:-1px;"></i> PAYOUT TARGET REACHED</span>`:''}
    </div>

    <!-- Profit target bar -->
    <div style="margin-bottom:14px;">
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;flex-wrap:wrap;gap:4px;">
        <span style="color:var(--muted);">Profit target (${acc.profitTarget||10}% = $${(acc.startBal*(acc.profitTarget||10)/100).toFixed(0)})</span>
        <span style="color:${tCol};">${st.targetProg.toFixed(1)}% complete · ${fa(Math.max(0,st.tot))} earned · $${st.targetRemain$.toFixed(0)} to go</span>
      </div>
      <div class="bar-wrap" style="height:10px;border-radius:5px;">
        <div class="bar-fill" style="width:${st.targetProg}%;background:${tCol};height:10px;border-radius:5px;"></div>
      </div>
      ${st.targetReached?`<div class="alert-banner" style="background:#34d39911;border:1px solid #34d39933;color:#34d399;margin-top:8px;"><i class="ti ti-trophy" style="font-size:14px;"></i> Target hit! Uh can request ur payout now. Consider protecting these gains.</div>`:''}
    </div>

    <!-- Daily profit cap bar -->
    <div>
      <div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:5px;flex-wrap:wrap;gap:4px;">
        <span style="color:var(--muted);">Daily profit cap (${acc.dailyProfitCap||2}% = $${(acc.startBal*(acc.dailyProfitCap||2)/100).toFixed(0)}/day)</span>
        <span style="color:${cCol};">${st.capProg.toFixed(1)}% · ${fa(st.todP)} today · cap $${st.cap$.toFixed(0)}</span>
      </div>
      <div class="bar-wrap">
        <div class="bar-fill" style="width:${st.capProg}%;background:${cCol};"></div>
      </div>
      ${st.capReached?`<div class="alert-banner" style="background:#f59e0b11;border:1px solid #f59e0b33;color:#f59e0b;margin-top:8px;"><i class="ti ti-alert-triangle" style="font-size:14px;"></i> Daily profit cap reached — great session! Stay disciplined, log off for today.</div>`:''}
    </div>
  </div>`;

  // PnL entry form
  const entryForm=`<div class="card" style="margin-bottom:10px;">
    <p class="sec-title"><i class="ti ti-plus-circle" style="font-size:13px;vertical-align:-1px;"></i> Log PnL entry</p>
    <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;">
      <div style="flex:.7;min-width:130px;">
        <p style="font-size:11px;color:var(--muted);margin-bottom:4px;">Amount $ (negative = loss)</p>
        <input type="number" id="iAmt" placeholder="-48.50 or +120.00" value="${G.pa}" oninput="G.pa=this.value" onkeydown="if(event.key==='Enter')logP()">
      </div>
      <div style="flex:2;min-width:150px;">
        <p style="font-size:11px;color:var(--muted);margin-bottom:4px;">Note (optional)</p>
        <input type="text" id="iNote" placeholder="e.g. XAUUSD London OB trade" value="${G.pn}" oninput="G.pn=this.value" onkeydown="if(event.key==='Enter')logP()">
      </div>
      <div><button class="btn" style="padding:8px 16px;border-color:${acol};color:${acol};" onclick="logP()"><i class="ti ti-check"></i> Add entry</button></div>
    </div>
  </div>`;

  // PnL history
  let logHtml='';
  if(!acc.log.length){
    logHtml=`<p style="color:var(--muted);font-size:12px;text-align:center;padding:2rem 0;">No entries yet. Start logging above.</p>`;
  }else{
    const chrono=[...acc.log].reverse();
    let rb=acc.startBal;
    const wb=chrono.map(e=>{rb+=e.amt;return{...e,rb};});
    const rows=[...wb].reverse().map(e=>`<div class="fhr">
      <span style="color:var(--muted);font-size:11px;">${fd(e.date)}</span>
      <span style="font-weight:600;color:${pc(e.amt)};">${fa(e.amt)}</span>
      <span style="color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;" title="${esc(e.note||'')}">${esc(e.note||'—')}</span>
      <span style="text-align:right;font-weight:500;">$${e.rb.toFixed(2)}</span>
      <span style="text-align:center;"><button onclick="rmE(${e.id})" style="background:transparent;border:none;cursor:pointer;padding:2px 4px;"><i class="ti ti-x" style="font-size:13px;color:var(--muted);"></i></button></span>
    </div>`).join('');
    logHtml=`<div class="log-scroll">
      <div class="fhr" style="padding-bottom:6px;border-bottom:1px solid ${acol}44;">
        <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Date</span>
        <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Amount</span>
        <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;">Note</span>
        <span style="font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px;text-align:right;">Balance</span>
        <span></span>
      </div>${rows}
    </div>`;
  }
  const logSec=`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <p class="sec-title" style="margin:0;"><i class="ti ti-list" style="font-size:13px;vertical-align:-1px;"></i> PnL history</p>
      ${acc.log.length?`<button class="btn btn-danger" style="font-size:11px;padding:3px 10px;" onclick="clearLog()"><i class="ti ti-trash" style="font-size:12px;vertical-align:-1px;"></i> Clear all</button>`:''}
    </div>${logHtml}
  </div>`;

  document.getElementById('app').innerHTML=`
    <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px;">
      <div><h1 class="h1">GFT Funded Tracker</h1><p style="color:var(--muted);font-size:11px;margin-top:2px;">XAUUSD · BTCUSD · SMC Strategy</p></div>
    </div>
    ${syncBar}
    <div style="margin-bottom:12px;">${tabs}</div>
    ${hdr}${ef}
    <div class="card" style="margin-bottom:10px;">
      <p class="sec-title"><i class="ti ti-chart-bar" style="font-size:13px;vertical-align:-1px;"></i> Account overview</p>
      ${stats}${cards2}
    </div>
    ${topRow}
    ${profitSection}
    ${entryForm}${logSec}
    <p style="text-align:center;color:#1e2a3a;font-size:10px;margin-top:16px;">GFT Tracker · synced via Google Sheets</p>`;
}

// ── Actions ───────────────────────────────────────────────
function selA(id){G.sel=id;G.em=false;render();}
function addA(){const a=mk(G.nid++);G.accs.push(a);G.sel=a.id;G.em=false;schedulePush();render();}
function rmA(id){
  if(G.accs.length<=1)return;
  if(!confirm('Remove this account and all its data?'))return;
  G.accs=G.accs.filter(a=>a.id!==id);G.sel=G.accs[0].id;schedulePush();render();
}
function togEdit(){G.eb={...G.accs.find(a=>a.id===G.sel)};G.em=!G.em;render();}
function ebu(k,v){if(G.eb)G.eb[k]=v;}
function saveEd(){
  G.accs=G.accs.map(a=>{
    if(a.id!==G.sel)return a;
    const u={...G.eb};
    u.deadline=ad(u.log.length?u.log[0].date:td(),u.deadlineDays||30);
    return u;
  });
  G.em=false;schedulePush();showToast('Changes saved ✓');render();
}
function logP(){
  const amt=parseFloat(G.pa);
  if(isNaN(amt))return;
  const t=td();
  G.accs=G.accs.map(a=>{
    if(a.id!==G.sel)return a;
    return{...a,log:[{id:Date.now(),date:t,amt,note:G.pn},...a.log],deadline:ad(t,a.deadlineDays||30)};
  });
  G.pa='';G.pn='';schedulePush();showToast('Entry added ✓');render();
}
function rmE(eid){
  G.accs=G.accs.map(a=>{
    if(a.id!==G.sel)return a;
    const nl=a.log.filter(e=>e.id!==eid);
    return{...a,log:nl,deadline:ad(nl.length?nl[0].date:td(),a.deadlineDays||30)};
  });
  schedulePush();render();
}
function clearLog(){
  if(!confirm('Clear all PnL entries for this account?'))return;
  G.accs=G.accs.map(a=>a.id!==G.sel?a:{...a,log:[],deadline:ad(td(),a.deadlineDays||30)});
  schedulePush();showToast('Log cleared');render();
}
function showToast(msg){
  const t=document.getElementById('toast');
  if(!t)return;
  t.textContent=msg;t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2000);
}

startApp();
</script>
</body>
</html>
